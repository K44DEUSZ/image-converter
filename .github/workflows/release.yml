name: Check and release library
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked version from package.json
        type: boolean
        default: false
      version:
        description: Exact version from package.json; required for publication
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  library:
    uses: K44DEUSZ/ip-calculator/.github/workflows/library-release.yml@42485043c550b1b7e0a5280d820b60954e14b3b3
    with:
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      release_version: ${{ inputs.version || '' }}
      helper_revision: 42485043c550b1b7e0a5280d820b60954e14b3b3
      app_id: ${{ vars.LIBRARY_DISPATCH_APP_ID }}
    secrets:
      app_private_key: ${{ secrets.LIBRARY_DISPATCH_APP_PRIVATE_KEY }}
