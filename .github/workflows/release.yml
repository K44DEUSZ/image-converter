name: Check and release library
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  library:
    uses: K44DEUSZ/ip-utils/.github/workflows/library-release.yml@0bb0233493868b0d980b8cfe1805a977da17f64a
    with:
      helper_revision: 0bb0233493868b0d980b8cfe1805a977da17f64a
      app_id: ${{ vars.LIBRARY_DISPATCH_APP_ID }}
    secrets:
      app_private_key: ${{ secrets.LIBRARY_DISPATCH_APP_PRIVATE_KEY }}
