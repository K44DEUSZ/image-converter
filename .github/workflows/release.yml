name: Check and release library
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  library:
    uses: K44DEUSZ/ip-utils/.github/workflows/library-release.yml@600151fffc0a4936de3e3bff8b8ec5a5b4e69b80
    with:
      helper_revision: 600151fffc0a4936de3e3bff8b8ec5a5b4e69b80
      app_id: ${{ vars.LIBRARY_DISPATCH_APP_ID }}
    secrets:
      app_private_key: ${{ secrets.LIBRARY_DISPATCH_APP_PRIVATE_KEY }}
