name: Check and release library
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  library:
    uses: K44DEUSZ/ip-utils/.github/workflows/library-release.yml@1864cc8d726358226d56ef314168b8172b946ff8
    with:
      helper_revision: 1864cc8d726358226d56ef314168b8172b946ff8
      app_id: ${{ vars.LIBRARY_DISPATCH_APP_ID }}
    secrets:
      app_private_key: ${{ secrets.LIBRARY_DISPATCH_APP_PRIVATE_KEY }}
